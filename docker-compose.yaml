version: "3.9"
services:
  mailserver:
    build: .
    ports:
      - "3000:3000"
    environment:
      MAILSERVER_CONFIG: /app/config.yaml
      MAILSERVER_PORT: "3000"
      MAILSERVER_DATA_DIR: /data
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/data
    networks:
      - eagle

networks:
  eagle:
    name: eagle
    external: true
